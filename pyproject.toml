# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[tool.poe.tasks]
# Scripts
bootstrap = {cmd = "./scripts/bootstrap", help = "Runs bootstrap"}
console = {cmd = "invenio shell", help = "Opens invenio shell"}
server = {cmd = "./scripts/server", help = "Starts the server"}
setup = {cmd = "./scripts/setup", help = "Runs full setup"}
setup_e2e = {cmd = "./scripts/setup --e2e", help = "Minimal setup for E2E tests (orgs, libs, locs, item types, patron types, circ policies, users — no documents/items)"}
update = {cmd = "./scripts/update", help = "Runs update"}
# Code quality
format = {cmd = "ruff format biblion tests", help = "Formats all files"}
lint = {cmd = "ruff check biblion tests", help = "Checks linting"}
# Tests
e2e = {cmd = "pytest tests/e2e -m \"e2e and not chromium_only\" --base-url https://localhost:5000 --browser chromium --browser firefox --browser webkit -o \"addopts=--color=yes\"", help = "Runs cross-browser E2E tests (requires a running Biblion instance)"}
e2e_chromium = {cmd = "pytest tests/e2e -m e2e --base-url https://localhost:5000 --browser chromium -o \"addopts=--color=yes\"", help = "Runs all E2E tests on Chromium including chromium_only tests (requires a running Biblion instance)"}
e2e_firefox = {cmd = "pytest tests/e2e -m \"e2e and not chromium_only\" --base-url https://localhost:5000 --browser firefox -o \"addopts=--color=yes\"", help = "Runs Playwright E2E tests on Firefox, skipping Chromium-only tests (requires a running Biblion instance)"}
e2e_webkit = {cmd = "pytest tests/e2e -m \"e2e and not chromium_only\" --base-url https://localhost:5000 --browser webkit -o \"addopts=--color=yes\"", help = "Runs Playwright E2E tests on WebKit, skipping Chromium-only tests (requires a running Biblion instance)"}
run_tests = {cmd = "./scripts/test", help = "Runs all tests"}
tests = {cmd = "pytest", help = "pytest"}
tests_debug = {cmd = "pytest -s -vv --no-cov", help = "pytest -s -vv --no-cov"}
# Translations
compile_catalog = {cmd = "pybabel compile -d biblion/translations/", help = "compile message catalogs to MO files"}
extract_messages = {cmd = "pybabel extract biblion/ -F babel.ini --project --copyright-holder=Hadeed --project=Biblion --msgid-bugs-address=hadeed.dev921@gmail.com -o biblion/translations/messages.pot -c NOTE", help = "extract messages from source files and generate a POT file"}
init_catalog = {cmd = "pybabel init -i biblion/translations/messages.pot -d biblion/translations/", help = "create new message catalogs from a POT file"}
update_catalog = {cmd = "pybabel update -i biblion/translations/messages.pot -d biblion/translations", help = "update existing message catalogs from a POT file"}

[tool.pytest.ini_options]
addopts = "--color=yes --ruff --exclude-warning-annotations --doctest-modules --cov=biblion --cov-report=term-missing --ignore=biblion/config.py --ignore=tests/e2e -m \"not external\""
testpaths = ["tests", "biblion"]
markers = [
    "external: mark a test as dealing with external services.",
    "e2e: mark a test as a Playwright end-to-end test (requires a running instance).",
    "chromium_only: mark a test as Chromium-only (Angular PrimeNG form submission incompatible with Playwright Firefox/WebKit).",
]
filterwarnings = [
    "ignore::PendingDeprecationWarning",
    # marshmallow: 'missing' argument renamed to 'load_default' (upstream fix needed)
    "ignore::DeprecationWarning:marshmallow",
    # iso639: uses codecs.open() internally
    "ignore:.*codecs\\.open.*:DeprecationWarning",
    # jsonmerge uses jsonschema.RefResolver which was deprecated in jsonschema 4.18
    "ignore:.*RefResolver.*:DeprecationWarning",
    # pytest-playwright: false positive when session-scoped browser fixture is used with multiple --browser flags
    "ignore:When using unittest.TestCase specifying multiple browsers is not supported:UserWarning",
]

[tool.ruff]
target-version = "py314"
extend-exclude = ["config.py"]
line-length = 120

[tool.ruff.lint]
extend-select = ["A", "C4", "D", "F", "I", "INT", "ISC", "N", "PERF", "PIE", "Q", "RET", "RUF", "SIM", "T20", "UP", "W"]
ignore = [
    "A001",    # builtin-variable-shadowing
    "A002",    # builtin-argument-shadowing
    "BLE001",  # blind-except: catching `Exception` is deliberate around external services and harvesters
    "D401",    # non-imperative-mood: docstring wording is left to the author
    "DTZ",     # flake8-datetimez: naive dates are intentional (MARC dates, circulation dates, display)
    "F403",    # undefined-local-with-import-star
    "F841",    # unused-variable
    "INT001",  # f-string-in-get-text-func-call
    "N801",    # invalid-class-name
    "N802",    # invalid-function-name: dojson handlers mirror the MARC field names
    "N803",    # invalid-argument-name
    "N806",    # non-lowercase-variable-in-function
    "N818",    # error-suffix-on-exception-name
    "PERF401", # manual-list-comprehension
    "RUF012",  # mutable-class-default: Invenio base classes rely on mutable class attributes
    "RUF059",  # unused-unpacked-variable
    "SIM102",  # collapsible-if
    "SIM115",  # open-file-with-context-handler
    "T201",    # print
]

[tool.ruff.lint.per-file-ignores]
# MARC transliteration fixtures deliberately mix Cyrillic and Latin look-alikes.
"tests/**" = ["RUF001"]  # ambiguous-unicode-character-string

[tool.ruff.lint.pydocstyle]
convention = "pep257"
